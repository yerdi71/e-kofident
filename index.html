<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a36">
<meta name="description" content="Nieoficjalny, demonstracyjny prototyp e-Kofident.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="e-Kofident">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/logo.svg">
<title>e-Kofident</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020813;color:#f5f8ff;font-family:Arial,system-ui,sans-serif}body{display:flex;justify-content:center}.device{position:relative;width:min(100vw,540px);margin:0 auto;line-height:0;box-shadow:0 0 70px #0008}.screen{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;display:block;border:0;background:transparent;cursor:pointer;padding:0;border-radius:14px;line-height:normal;-webkit-tap-highlight-color:transparent}.hotspot:focus-visible{outline:3px solid #36baff;background:#36baff22}.clock-overlay{position:absolute;left:3.2%;top:1.15%;height:3.4%;width:25%;display:flex;align-items:center;padding-left:1%;font:700 clamp(12px,3.2vw,17px)/1 Arial,sans-serif;color:#fff;text-shadow:0 1px 5px #000;letter-spacing:.2px;pointer-events:none;line-height:normal}
.h-info{left:87%;top:4.4%;width:9%;height:4.5%;border-radius:50%}
.tile1{left:3%;top:33.8%;width:46.5%;height:18.3%}.tile2{left:50.5%;top:33.8%;width:46.5%;height:18.3%}.tile3{left:3%;top:53%;width:46.5%;height:18.3%}.tile4{left:50.5%;top:53%;width:46.5%;height:18.3%}.tile5{left:3%;top:72.1%;width:46.5%;height:18.2%}.tile6{left:50.5%;top:72.1%;width:46.5%;height:18.2%}
.nav1{left:4%;top:91.5%;width:21%;height:7.8%}.nav2{left:27%;top:91.5%;width:21%;height:7.8%}.nav3{left:51%;top:91.5%;width:23%;height:7.8%}.nav4{left:76%;top:91.5%;width:20%;height:7.8%}
.backdrop{position:fixed;z-index:20;inset:0;background:#000b;display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px);line-height:normal}.backdrop[hidden]{display:none}.modal{position:relative;width:min(100%,430px);max-height:86vh;overflow:auto;padding:25px 22px 22px;border:1px solid #2879b6;border-radius:20px;background:linear-gradient(145deg,#102849,#050e1c);box-shadow:0 25px 90px #0009}.close{position:absolute;right:12px;top:8px;background:none;border:0;color:#b8d8f2;font-size:28px;cursor:pointer}.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#0b3b67;color:#5bc6ff;font-size:20px;font-weight:800;margin-bottom:13px}.eyebrow{font-size:9px;letter-spacing:1.4px;color:#62c8ff;font-weight:800}.modal h2{font-size:23px;margin:7px 0 12px}.body{font-size:12px;line-height:1.65;color:#c4d6e8}.body p{margin:0 0 10px}.body ul{padding-left:18px}.body li{margin:5px 0}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:11px;color:#b8d2eb}.field input,.field textarea,.field select{width:100%;background:#030c18;border:1px solid #28527a;border-radius:10px;color:white;padding:12px;font:12px Arial,sans-serif}.field textarea{min-height:85px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:1px solid #2c5c84;border-radius:10px;padding:11px 14px;background:#102b48;color:#edf8ff;font-weight:700;font-size:11px;cursor:pointer}.primary{background:#087df0;border-color:#229bff}.entry{padding:10px 0;border-bottom:1px solid #1e3853}.entry strong{display:block;font-size:12px}.entry small{display:block;font-size:10px;line-height:1.5;color:#9bb5cf;margin-top:4px}.empty{padding:20px;text-align:center;color:#9db3cc;font-size:12px}.toast{position:fixed;z-index:30;bottom:22px;left:50%;transform:translate(-50%,12px);opacity:0;transition:.2s;background:#eaf7ff;color:#09203a;border-radius:11px;padding:12px 15px;font-size:11px;font-weight:700;max-width:calc(100% - 30px);text-align:center;line-height:1.3;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.disclaimer{font-size:10px;color:#8da8c4;margin-top:12px}
@media(min-width:541px){.device{width:430px;margin:20px auto;align-self:flex-start}.screen{border-radius:22px}.hotspot{cursor:pointer}}
</style>
</head>
<body>
<div class="device" aria-label="Interaktywny ekran e-Kofident">
<img class="screen" src="referencja-ui.png" alt="Referencyjny ekran aplikacji e-Kofident"><div class="clock-overlay" id="liveClock">--:--</div>
<button class="hotspot h-info" data-action="info" aria-label="Informacje o aplikacji"></button>
<button class="hotspot tile1" data-action="new" aria-label="Nowe zgłoszenie"></button>
<button class="hotspot tile2" data-action="place" aria-label="Obserwacja miejsca"></button>
<button class="hotspot tile3" data-action="private" aria-label="Notatka prywatna"></button>
<button class="hotspot tile4" data-action="cases" aria-label="Lista spraw"></button>
<button class="hotspot tile5" data-action="map" aria-label="Widok obszaru"></button>
<button class="hotspot tile6" data-action="stats" aria-label="Podsumowanie"></button>
<button class="hotspot nav1" data-action="home" aria-label="Start"></button>
<button class="hotspot nav2" data-action="cases" aria-label="Moje zgłoszenia"></button>
<button class="hotspot nav3" data-action="tips" aria-label="Porady"></button>
<button class="hotspot nav4" data-action="profile" aria-label="Profil"></button>
</div>
<div class="backdrop" id="backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="title"><button class="close" id="close" aria-label="Zamknij">×</button><div class="icon" id="icon">i</div><div class="eyebrow" id="eyebrow">INFORMACJE</div><h2 id="title">O aplikacji</h2><div class="body" id="body"></div><div class="actions" id="actions"></div></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{const KEY="ekofident.exactmock.entries";const $=s=>document.querySelector(s);let timer;
const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}};const save=a=>localStorage.setItem(KEY,JSON.stringify(a));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>new Date(s).toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function toast(t){let n=$("#toast");n.textContent=t;n.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>n.classList.remove("show"),2400)}
function close(){ $("#backdrop").hidden=true }
function modal(title,body,buttons=[],icon="i",eyebrow="PANEL INFORMACYJNY"){$("#title").textContent=title;$("#body").innerHTML=body;$("#icon").textContent=icon;$("#eyebrow").textContent=eyebrow;let area=$("#actions");area.innerHTML="";buttons.forEach(x=>{let b=document.createElement("button");b.className="btn "+(x.primary?"primary":"");b.textContent=x.label;b.onclick=()=>{close();x.run?.()};area.appendChild(b)});$("#backdrop").hidden=false}
function info(){modal("Informacje o e-Kofident",`<p><strong>e-Kofident</strong> w tym podglądzie odtwarza wygląd wskazanego projektu. To niezależny prototyp, nieoficjalnie powiązany z Policją ani instytucjami państwowymi.</p><ul><li>Formularze zapisują wpisy wyłącznie w pamięci lokalnej tej przeglądarki.</li><li>Nic nie jest wysyłane do Policji ani innych służb.</li><li>Nie ma rzeczywistego GPS, wysyłania zdjęć, serwera ani synchronizacji.</li><li>Komunikaty pokazane na obrazie są częścią grafiki referencyjnej, a nie prawdziwymi powiadomieniami.</li></ul><p>Nie wpisuj danych wrażliwych ani niezweryfikowanych oskarżeń. W nagłym zagrożeniu życia lub zdrowia w Polsce dzwoń pod 112.</p>`,[{label:"Rozumiem",primary:true}])}
function form(category="Zgłoszenie"){modal("Nowe zgłoszenie",`<p>Wypełnij formularz. Wpis pozostanie na tym urządzeniu.</p><form id="form"><div class="field"><label for="cat">Typ wpisu</label><select id="cat"><option ${category==="Zgłoszenie"?"selected":""}>Zgłoszenie</option><option ${category==="Miejsce"?"selected":""}>Miejsce</option><option ${category==="Prywatna"?"selected":""}>Prywatna</option></select></div><div class="field"><label for="t">Tytuł</label><input id="t" maxlength="90" required placeholder="Tytuł własnej notatki"></div><div class="field"><label for="d">Opis</label><textarea id="d" maxlength="1200" placeholder="Wpisz obserwację…"></textarea></div><p class="disclaimer">Dane nie są wysyłane do służb. Unikaj danych osobowych i niezweryfikowanych oskarżeń.</p><div class="actions"><button class="btn primary" type="submit">Zapisz lokalnie</button><button class="btn" type="button" id="cancel">Anuluj</button></div></form>`,[],"＋","LOKALNY WPIS");$("#cancel").onclick=close;$("#form").onsubmit=e=>{e.preventDefault();let c=$("#cat").value,t=$("#t").value.trim();if(!t)return;let a=get();a.unshift({id:Date.now(),category:c,title:t,description:$("#d").value.trim(),created:new Date().toISOString()});save(a);close();toast("Wpis zapisany lokalnie.");}}
function cases(){let a=get();let body=a.length?a.map(e=>`<div class="entry"><strong>${esc(e.title)}</strong><small>${esc(e.category)} · ${date(e.created)}${e.description?"<br>"+esc(e.description):""}</small><button class="btn" data-del="${e.id}">Usuń wpis</button></div>`).join(""):`<div class="empty">Brak lokalnych wpisów. Dodaj pierwszy, aby pojawił się na liście.</div>`;modal("Moje zgłoszenia",body,[{label:"＋ Dodaj wpis",primary:true,run:()=>form()},{label:"Wyczyść listę",run:clearAll}],"▤","TWOJE DANE");document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{save(get().filter(e=>String(e.id)!==b.dataset.del));close();cases();toast("Usunięto wpis.")})}
function clearAll(){modal("Usunąć wszystkie wpisy?","Ta operacja usunie wpisy zapisane w tej przeglądarce. Nie można jej cofnąć.",[{label:"Usuń wszystko",primary:true,run:()=>{save([]);toast("Lista wyczyszczona.")}},{label:"Anuluj"}],"!","POTWIERDZENIE")}
function stats(){let a=get();modal("Twoja aktywność",`<div class="entry"><strong>${a.length} zapisanych wpisów</strong><small>W pamięci lokalnej przeglądarki.</small></div><div class="entry"><strong>${a.filter(x=>x.category==="Zgłoszenie").length} wpisów typu zgłoszenie</strong></div><div class="entry"><strong>${a.filter(x=>x.category==="Miejsce").length} obserwacji miejsc</strong></div><p class="disclaimer">To statystyki lokalne. Nie potwierdzają wysłania ani skuteczności zgłoszeń.</p>`,[{label:"Pokaż listę",primary:true,run:cases}],"▥","STATYSTYKI LOKALNE")}
function map(){modal("Widok obszaru","W tym prototypie nie ma prawdziwej mapy ani odczytu GPS. Możesz zapisać opis miejsca jako lokalną notatkę.",[{label:"Dodaj obserwację",primary:true,run:()=>form("Miejsce")}],"⌖","PODGLĄD")}
function tips(){modal("Porady","<p>• Zapisuj tylko własne obserwacje i oddzielaj je od przypuszczeń.</p><p>• Nie publikuj cudzych danych osobowych.</p><p>• Aplikacja nie jest kanałem zgłoszeniowym do służb. W sytuacji nagłej dzwoń pod 112.</p>",[{label:"Zamknij",primary:true}],"i","INFORMACJE")}
function changes(){modal("Zmiany i plany",`<div class="entry"><strong>Wprowadzone zmiany</strong><small>• Zegar pokazuje aktualną godzinę.<br>• Usunięto ikony baterii i statusu z górnego paska.<br>• Dodano lokalne formularze i listę wpisów.<br>• Dodano panel informacji o charakterze aplikacji.</small></div><div class="entry"><strong>Wkrótce</strong><small>• Pełnoprawna mapa.<br>• Zaznaczanie miejsc do zgłoszenia.<br>• System punktowy i humorystyczne rangi.<br>• Rozbudowane statystyki aktywności.</small></div><p class="disclaimer">Lista planów nie oznacza, że te funkcje są już dostępne. W tej wersji wpisy są lokalne i nie są wysyłane do służb.</p>`,[{label:"Zamknij",primary:true}],"↻","DZIENNIK ZMIAN")}
function settings(){modal("Ustawienia",`<p>Ustawienia i informacje o tej wersji aplikacji.</p><div class="entry"><strong>Informacje</strong><small>Wyjaśnienie charakteru aplikacji i jej ograniczeń.</small><button class="btn" id="settingsInfo">Otwórz informacje</button></div><div class="entry"><strong>Zmiany i plany</strong><small>Co już dodano i co jest planowane.</small><button class="btn" id="settingsChanges">Zobacz zmiany</button></div><div class="entry"><strong>Dane lokalne</strong><small>Wpisy zapisane w tej przeglądarce: ${get().length}</small><button class="btn" id="settingsCases">Lista spraw</button></div>`,[{label:"Zamknij",primary:true}],"⚙","USTAWIENIA");$("#settingsInfo").onclick=()=>info();$("#settingsChanges").onclick=()=>changes();$("#settingsCases").onclick=()=>cases()}
function profile(){modal("Profil lokalny",`<p>W tym prototypie nie ma konta ani publicznego profilu.</p><p>Liczba zapisanych wpisów: <strong>${get().length}</strong>.</p>`,[{label:"Ustawienia",primary:true,run:settings},{label:"Informacje",run:info}],"◉","PROFIL")}
document.addEventListener("click",e=>{let a=e.target.closest("[data-action]")?.dataset.action;if(!a)return;({info, new:()=>form(),place:()=>form("Miejsce"),private:()=>form("Prywatna"),cases,map,stats,home:()=>{close();window.scrollTo({top:0,behavior:"smooth"})},tips,profile,settings,changes})[a]?.()});
function updateClock(){const n=new Date();$("#liveClock").textContent=n.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});}updateClock();setInterval(updateClock,1000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
$("#close").onclick=close;$("#backdrop").onclick=e=>{if(e.target===$("#backdrop"))close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
})();
</script>
</body></html>
